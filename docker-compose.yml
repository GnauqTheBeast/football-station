name: football-ddb

# =============================================================================
# Hệ thống CSDL phân tán V-League: MASTER (Trung tâm) - postgres_fdw
# File này CHỈ chứa service MASTER để chạy trên máy của bạn.
# 6 stations chạy riêng trên máy các bạn (xem docker-compose.station.yml).
#
# Khởi động master + FDW setup (sau khi 6 station friends đã healthy qua ZeroTier):
#   docker network create football-net     # chỉ 1 lần
#   docker compose up -d master
#   # set ZeroTier IPs của 6 bạn trong .env.master:
#   STATION1_HOST=10.147.17.11 ... STATION6_HOST=10.147.17.16
#   ./scripts/setup-fdw.sh
#
# All-in-1 dev mode (tất cả 7 trên máy bạn): use docker-compose.dev.yml (TODO).
# =============================================================================

services:
  master:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: football-master
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-vleague_master}
      NODE_ROLE: master
    ports:
      - "5430:5432"
    volumes:
      - master_data:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./db/master:/db/master:ro
      - ./scripts/init-node.sh:/docker-entrypoint-initdb.d/init-node.sh:ro
      - ./scripts/setup-fdw.sh:/setup-fdw.sh:ro
    networks:
      football_net:
        aliases: [master]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Next.js SSR web app (optional, opt-in via profile "app")
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: football-app
    depends_on:
      master:
        condition: service_healthy
    environment:
      POSTGRES_HOST: master
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-vleague_master}
      NODE_ROLE: master                          # App query master (vw_global_*)
    ports:
      - "6789:6789"
    profiles: ["app"]
    restart: unless-stopped
    networks:
      - football_net

volumes:
  master_data:

networks:
  football_net:
    external: true
    name: ${NETWORK_NAME:-football-net}
